name: Sync fork

on:
  schedule:
    - cron: '17 */4 * * *' # 每 4 小时同步一次（UTC 时间）
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 调用 GitHub 官方 merge-upstream API（即网页 "Sync fork" 按钮的机制），
      # 可快进时快进，已分叉时自动合并，不会因为本仓库自身多出的提交而失败
      - name: Sync from upstream yetone/magpie
        run: |
          set -euo pipefail
          response=$(curl -s -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/MeYangGe/magpie/merge-upstream" \
            -d '{"branch":"main"}')
          http_code=$(tail -n 1 <<<"$response")
          body=$(head -n -1 <<<"$response")
          echo "$body"
          if [ "$http_code" != "200" ]; then
            echo "::error::同步失败（HTTP $http_code）"
            exit 1
          fi
